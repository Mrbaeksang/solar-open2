name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: apps/api/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Build API container
        run: docker build --tag solar-open2-api:ci apps/api
      - name: Smoke-test API container
        run: |
          container=solar-open2-api-ci
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run \
            --detach \
            --env PROVIDER_MODE=deterministic \
            --name "$container" \
            --publish 18080:8080 \
            solar-open2-api:ci
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
      - run: pnpm --filter @solar-open2/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
